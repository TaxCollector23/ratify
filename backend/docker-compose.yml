version: "3.9"

x-env: &common-env
  DATABASE_URL: postgres://ratify:ratify@postgres:5432/ratify
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: ratify-artifacts
  S3_ACCESS_KEY_ID: ratify
  S3_SECRET_ACCESS_KEY: ratify-secret
  LOG_LEVEL: info
  NODE_ENV: development
  GITHUB_APP_ID: ${GITHUB_APP_ID:-}
  GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
  GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
  GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-dev-webhook-secret}
  RATIFY_LLM_PROVIDER: ${RATIFY_LLM_PROVIDER:-mock}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
  RATIFY_APP_URL: http://localhost:4000
  REPO_SYNC_WORKDIR: /tmp/ratify-repos

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ratify
      POSTGRES_PASSWORD: ratify
      POSTGRES_DB: ratify
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratify"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ratify
      MINIO_ROOT_PASSWORD: ratify-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]

  migrate:
    build: { context: ., dockerfile: Dockerfile, args: { APP_PATH: packages/db } }
    environment: *common-env
    entrypoint: ["pnpm", "exec", "tsx", "src/migrate.ts"]
    depends_on:
      postgres: { condition: service_healthy }

  webhook-handler:
    build: { context: ., dockerfile: Dockerfile, args: { APP_PATH: apps/webhook-handler } }
    environment: { <<: *common-env, PORT: "4001" }
    ports: ["4001:4001"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  api-server:
    build: { context: ., dockerfile: Dockerfile, args: { APP_PATH: apps/api-server } }
    environment: { <<: *common-env, PORT: "4000" }
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  worker:
    build: { context: ., dockerfile: Dockerfile, args: { APP_PATH: apps/worker } }
    environment: *common-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  admin-metrics:
    build: { context: ., dockerfile: Dockerfile, args: { APP_PATH: apps/admin-metrics } }
    environment: { <<: *common-env, PORT: "4002" }
    ports: ["4002:4002"]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  minio-data:
